server {
    listen 127.0.0.1:18080 default_server;
    server_name _;
    access_log off;

    location = /actuator/prometheus {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
    }

    location / {
        return 404;
    }
}
