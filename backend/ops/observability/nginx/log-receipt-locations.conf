# Counts only: no caller-supplied LogQL, timestamps, raw messages or environment.

location = /dev/log-receipt {
    if ($ssl_client_s_dn != "CN=knot-dev-alloy") { return 403; }
    if ($request_method != GET) { return 405; }
    if ($args !~ "^slot=(blue|green)&request_id=[0-9a-f]{32}$") { return 400; }
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:3100/loki/api/v1/query?query=sum%28count_over_time%28%7Bproject%3D%22knot%22%2Cenv%3D%22dev%22%2Cjob%3D%22spring%22%2Cslot%3D%22${arg_slot}%22%2Cunit%3D%22knot-backend-${arg_slot}.service%22%7D%20%7C%3D%20%22${arg_request_id}%22%20%7C%3D%20%22HTTP%20dispatch%20finished%22%20%5B5m%5D%29%29;
}

location = /prod/log-receipt {
    if ($ssl_client_s_dn != "CN=knot-prod-alloy") { return 403; }
    if ($request_method != GET) { return 405; }
    if ($args !~ "^slot=(blue|green)&request_id=[0-9a-f]{32}$") { return 400; }
