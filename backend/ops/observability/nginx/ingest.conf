server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /opt/knot-observability/tls/server.crt;
    ssl_certificate_key /opt/knot-observability/tls/server.key;
    ssl_client_certificate /opt/knot-observability/tls/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;

    include /etc/nginx/snippets/knot-ingest-allow.conf;
    allow 127.0.0.1;
    deny all;

    location = /dev/api/v1/write {
        if ($ssl_client_s_dn != "CN=knot-dev-alloy") { return 403; }
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9090/api/v1/write;
    }
    location = /prod/api/v1/write {
        if ($ssl_client_s_dn != "CN=knot-prod-alloy") { return 403; }
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9090/api/v1/write;
    }
    location = /mac/api/v1/write {
        if ($ssl_client_s_dn != "CN=knot-mac-alloy") { return 403; }
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:9090/api/v1/write;
    }
    location = /dev/loki/api/v1/push {
        if ($ssl_client_s_dn != "CN=knot-dev-alloy") { return 403; }
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3100/loki/api/v1/push;
    }
    location = /prod/loki/api/v1/push {
        if ($ssl_client_s_dn != "CN=knot-prod-alloy") { return 403; }
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3100/loki/api/v1/push;
    }
    location / { return 404; }
}
