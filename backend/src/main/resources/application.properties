spring.application.name=backend
logging.pattern.level=%5p request_id=%X{requestId:-none} instance=${KNOT_INSTANCE:${HOSTNAME:unknown}}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knot}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# API documentation
knot.api-docs.enabled=false
springdoc.api-docs.enabled=${knot.api-docs.enabled}
springdoc.swagger-ui.enabled=${knot.api-docs.enabled}
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.validatorUrl=none
springdoc.swagger-ui.supportedSubmitMethods=
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.queryConfigEnabled=false

# OAuth
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user

# JWT
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.expiration=PT1H
auth.jwt.nickname-token-expiration=PT10M
auth.jwt.issuer=${JWT_ISSUER:https://knoted.kr}
auth.jwt.audience=${JWT_AUDIENCE:knot-api}
auth.jwt.cookie-name=__Host-KNOT_ACCESS_TOKEN
auth.jwt.nickname-cookie-name=KNOT_NICKNAME_TOKEN
auth.jwt.refresh-cookie-name=__Host-KNOT_REFRESH_TOKEN
auth.jwt.secure=${JWT_COOKIE_SECURE:true}

# CORS
auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:${AUTH_CORS_ALLOWED_ORIGIN:https://knoted.kr}}

# Workspace invitation
workspace.invitation.lookup-hash-key=${WORKSPACE_INVITATION_LOOKUP_HASH_KEY:}

# OAuth login result
auth.oauth2.success-redirect-uri=${AUTH_SUCCESS_REDIRECT_URI:/api/v1/auth/me}
auth.oauth2.nickname-redirect-uri=${AUTH_NICKNAME_REDIRECT_URI:/onboarding}
auth.oauth2.failure-redirect-uri=${AUTH_FAILURE_REDIRECT_URI:/login?error=oauth2}

# Recording audio storage
recording.audio-storage.endpoint=${RECORDING_AUDIO_STORAGE_ENDPOINT:}
recording.audio-storage.region=${RECORDING_AUDIO_STORAGE_REGION:}
recording.audio-storage.bucket=${RECORDING_AUDIO_STORAGE_BUCKET:}
recording.audio-storage.access-key=${RECORDING_AUDIO_STORAGE_ACCESS_KEY:}
recording.audio-storage.secret-key=${RECORDING_AUDIO_STORAGE_SECRET_KEY:}
recording.audio-storage.upload-url-ttl=${RECORDING_AUDIO_STORAGE_UPLOAD_URL_TTL:PT15M}

recording.audio-storage.key-prefix=${RECORDING_AUDIO_STORAGE_KEY_PREFIX:}

# LLM
knot.llm.enabled=${LLM_ENABLED:false}
knot.llm.provider=${LLM_PROVIDER:lm-studio}
knot.llm.base-url=${LLM_BASE_URL:}
knot.llm.api-token=${LLM_API_TOKEN:}
knot.llm.model=${LLM_MODEL:}
knot.llm.connect-timeout=${LLM_CONNECT_TIMEOUT:PT3S}
knot.llm.request-timeout=${LLM_REQUEST_TIMEOUT:PT120S}
knot.llm.max-response-bytes=${LLM_MAX_RESPONSE_BYTES:262144}

knot.transcription.enabled=${TRANSCRIPTION_ENABLED:false}
knot.transcription.base-url=${TRANSCRIPTION_BASE_URL:http://127.0.0.1:18765}
knot.transcription.token=${TRANSCRIPTION_TOKEN:}
knot.transcription.connect-timeout=${TRANSCRIPTION_CONNECT_TIMEOUT:PT5S}
knot.transcription.request-timeout=${TRANSCRIPTION_REQUEST_TIMEOUT:PT30S}
knot.transcription.poll-interval=${TRANSCRIPTION_POLL_INTERVAL:PT2S}
knot.transcription.job-timeout=${TRANSCRIPTION_JOB_TIMEOUT:PT12H}
knot.document-generation.worker.enabled=${DOCUMENT_GENERATION_WORKER_ENABLED:false}
knot.document-generation.worker.concurrency=${DOCUMENT_GENERATION_WORKER_CONCURRENCY:2}
knot.document-generation.worker.candidate-limit=${DOCUMENT_GENERATION_WORKER_CANDIDATE_LIMIT:20}
knot.document-generation.worker.poll-interval=${DOCUMENT_GENERATION_WORKER_POLL_INTERVAL:PT1S}
knot.document-generation.worker.recovery-interval=${DOCUMENT_GENERATION_WORKER_RECOVERY_INTERVAL:PT5S}
knot.document-generation.worker.execution-lease=${DOCUMENT_GENERATION_WORKER_EXECUTION_LEASE:PT150S}
knot.document-generation.worker.automatic-retry-backoff=${DOCUMENT_GENERATION_AUTOMATIC_RETRY_BACKOFF:PT5S}

knot.search.worker.enabled=${SEARCH_WORKER_ENABLED:false}
knot.search.agent.enabled=${SEARCH_AGENT_ENABLED:false}
knot.search.agent.signing-key=${SEARCH_MCP_SIGNING_KEY:}
knot.search.agent.mcp-base-url=${SEARCH_MCP_BASE_URL:http://127.0.0.1:${server.port:8080}}
knot.search.agent.budget=${SEARCH_AGENT_BUDGET:PT120S}
knot.search.agent.tool-call-limit=${SEARCH_TOOL_CALL_LIMIT:12}
knot.search.agent.read-code-points=${SEARCH_READ_CODE_POINTS:6000}
knot.search.agent.context-character-limit=${SEARCH_CONTEXT_CHARACTER_LIMIT:48000}

# Recording connection expiry
recording.connection-expiry.enabled=${RECORDING_CONNECTION_EXPIRY_ENABLED:true}
recording.connection-expiry.interval=${RECORDING_CONNECTION_EXPIRY_INTERVAL:PT1S}
recording.connection-expiry.batch-size=${RECORDING_CONNECTION_EXPIRY_BATCH_SIZE:100}

# WAV 조립 워커는 선행 기능과 AI WAV 호환 검증 후 별도로 활성화한다.
recording.audio-finalization.enabled=${RECORDING_AUDIO_FINALIZATION_ENABLED:false}

# 전사 대기열: 실행 소유권과 원격 준비 대기 상한
knot.transcription.dispatch-interval=${TRANSCRIPTION_DISPATCH_INTERVAL:PT1S}
knot.transcription.lease-duration=${TRANSCRIPTION_LEASE_DURATION:PT60S}
knot.transcription.lease-renew-interval=${TRANSCRIPTION_LEASE_RENEW_INTERVAL:PT15S}
knot.transcription.readiness-timeout=${TRANSCRIPTION_READINESS_TIMEOUT:PT120S}
