plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.9.0'
}

group = 'com.knot'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.ai:mcp-spring-webmvc:2.0.1'
	implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.0.0'

	implementation 'org.flywaydb:flyway-database-postgresql'

	implementation platform('software.amazon.awssdk:bom:2.55.11')
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'

	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
	java {
		// JPA Entity는 애노테이션 필드 블록 공백 규칙을 별도로 적용한다.
		targetExclude('src/main/java/com/knot/backend/member/domain/Member.java')
		eclipse('4.39').configFile('config/spotless/eclipse-formatter.xml')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.withType(Test).configureEach {
	systemProperty 'spring.test.context.cache.maxSize', '8'
	systemProperty 'aws.accessKeyId', 'test-access-key'
	systemProperty 'aws.secretAccessKey', 'test-secret-key'
	maxHeapSize = '1g'
}

tasks.named('processTestResources') {
	from('src/main/resources/db/migration') {
		exclude 'V49__*.sql', 'V50__*.sql'
		into 'db/transcription-queue-history'
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration', 'acceptance'
	}
}

tasks.register('integrationTest', Test) {
	group = 'verification'
	description = 'Runs integration tests.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnitPlatform {
		includeTags 'integration'
	}

	shouldRunAfter test
}

tasks.register('acceptanceTest', Test) {
	group = 'verification'
	description = 'Runs acceptance tests.'

	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	useJUnitPlatform {
		includeTags 'acceptance'
	}

	shouldRunAfter integrationTest
}

tasks.named('check') {
	dependsOn integrationTest
	dependsOn acceptanceTest
}
