name: Backend CI

on:
  pull_request:

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    outputs:
      integration_tests: ${{ steps.integration-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run integration tests
        id: integration-tests
        run: ./gradlew integrationTest

      - name: Preserve test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/test-results/
            backend/build/reports/tests/
          if-no-files-found: warn

  remaining:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    outputs:
      formatting: ${{ steps.formatting.outcome }}
      unit_tests: ${{ steps.unit-tests.outcome }}
      acceptance_tests: ${{ steps.acceptance-tests.outcome }}
      build: ${{ steps.build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check formatting
        id: formatting
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        id: unit-tests
        run: ./gradlew test

      - name: Run acceptance tests
        id: acceptance-tests
        run: ./gradlew acceptanceTest

      - name: Build
        id: build
        run: ./gradlew bootJar

      - name: Preserve test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-remaining-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/test-results/
            backend/build/reports/tests/
          if-no-files-found: warn

  verify:
    needs:
      - integration
      - remaining
    if: ${{ always() }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Verify required jobs
        if: ${{ always() }}
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REMAINING_RESULT: ${{ needs.remaining.result }}
        run: |
          if [ "$INTEGRATION_RESULT" != "success" ] || [ "$REMAINING_RESULT" != "success" ]; then
            echo "Required validation jobs did not both succeed (integration=$INTEGRATION_RESULT, remaining=$REMAINING_RESULT)."
            exit 1
          fi

      - name: Notify Discord on failure
        if: ${{ failure() && (needs.integration.result == 'failure' || needs.remaining.result == 'failure' || steps.checkout.outcome == 'failure') }}
        working-directory: .
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BACKEND_CI_WEBHOOK_URL }}

          FORMATTING: ${{ needs.remaining.outputs.formatting }}
          UNIT_TESTS: ${{ needs.remaining.outputs.unit_tests }}
          INTEGRATION_TESTS: ${{ needs.integration.outputs.integration_tests }}
          ACCEPTANCE_TESTS: ${{ needs.remaining.outputs.acceptance_tests }}
          BUILD: ${{ needs.remaining.outputs.build }}

          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}

          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}

          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}

        run: |
          FAILED_STAGE="Unknown"

          if [ "$FORMATTING" = "failure" ]; then
            FAILED_STAGE="Formatting"
          elif [ "$UNIT_TESTS" = "failure" ]; then
            FAILED_STAGE="Unit Test"
          elif [ "$INTEGRATION_TESTS" = "failure" ]; then
            FAILED_STAGE="Integration Test"
          elif [ "$ACCEPTANCE_TESTS" = "failure" ]; then
            FAILED_STAGE="Acceptance Test"
          elif [ "$BUILD" = "failure" ]; then
            FAILED_STAGE="Build"
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            GITHUB_USER="$PR_AUTHOR"
            TITLE="#$PR_NUMBER $PR_TITLE"
            DESCRIPTION="Pull Request CI 검증에 실패했습니다."
            TARGET_URL="$PR_URL"
          else
            GITHUB_USER="$ACTOR"
            TITLE="$BRANCH Branch CI Failed"
            DESCRIPTION="$BRANCH 브랜치 CI 검증에 실패했습니다."
            TARGET_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          fi

          DISCORD_ID=$(awk -v user="$GITHUB_USER" \
            '$1 == user ":" {gsub(/"/, "", $2); print $2}' \
            .github/discord-users.yml)

          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"

          if [ -n "$DISCORD_ID" ]; then
            CONTENT="<@$DISCORD_ID>"
          else
            CONTENT=""
          fi

          PAYLOAD=$(jq -n \
            --arg content "$CONTENT" \
            --arg discord_id "$DISCORD_ID" \
            --arg title "🚨 Backend CI Failed" \
            --arg description "$DESCRIPTION" \
            --arg pr_title "$TITLE" \
            --arg author "$GITHUB_USER" \
            --arg branch "$BRANCH" \
            --arg sha "$SHORT_SHA" \
            --arg failed_stage "$FAILED_STAGE" \
            --arg target_url "$TARGET_URL" \
            --arg run_url "$RUN_URL" \
            '{
              username: "Knot GitHub",
              content: $content,
              allowed_mentions: {
                users: (
                  if $discord_id == ""
                  then []
                  else [$discord_id]
                  end
                )
              },
              embeds: [
                {
                  title: $title,
                  description: (
                    "**" + $pr_title + "**\n\n" +
                    $description
                  ),
                  url: $target_url,
                  color: 15158332,
                  fields: [
                    {
                      name: "❌ Failed Stage",
                      value: ("`" + $failed_stage + "`"),
                      inline: true
                    },
                    {
                      name: "👤 Author",
                      value: ("`" + $author + "`"),
                      inline: true
                    },
                    {
                      name: "🌿 Branch",
                      value: ("`" + $branch + "`"),
                      inline: true
                    },
                    {
                      name: "📝 Commit",
                      value: ("`" + $sha + "`"),
                      inline: true
                    },
                    {
                      name: "🔗 GitHub Actions",
                      value: ("[실패 로그 확인](" + $run_url + ")"),
                      inline: false
                    }
                  ]
                }
              ]
            }')

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
