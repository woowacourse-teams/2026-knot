name: Context affinity B2 V2 PR1079
on:
  push:
    branches:
      - 'be/chore/#1070'
    paths:
      - '.github/cache-probe/affinity1070/trigger-v2.txt'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - uses: actions/checkout@v6
        with:
          ref: d7d66773d8756f77dcd195f8621117a64e715a78
          path: source
      - name: Apply affinity candidate
        working-directory: ${{ github.workspace }}
        run: |
          base64 -d "$GITHUB_WORKSPACE/harness/.github/cache-probe/affinity1070/candidate-v2.b64" > /tmp/affinity-candidate.patch
          printf '%s  %s\n' 26c20a1f08380d00d30dcd719cdaf5e05f010f2a8aecb3e576e061f98adcb62a /tmp/affinity-candidate.patch | sha256sum -c -
          git -C source apply --check /tmp/affinity-candidate.patch
          git -C source apply /tmp/affinity-candidate.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run integration and observe
        env:
          FORK_COUNT: '2'
          CONTEXT_CACHE_SIZE: '8'
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/observe"
          git -C source rev-parse HEAD > "$GITHUB_WORKSPACE/observe/source.txt"
          nproc > "$GITHUB_WORKSPACE/observe/cores.txt"
          printf '%s\n' "$FORK_COUNT" > "$GITHUB_WORKSPACE/observe/forks.txt"
          export OBSERVE_METRICS="$GITHUB_WORKSPACE/observe/resources.csv"
          export MEMORY_CSV="$GITHUB_WORKSPACE/observe/memory.csv"
          export WORKER_PID_DIR="$GITHUB_WORKSPACE/observe/worker-pids"
          mkdir -p "$WORKER_PID_DIR"
          python3 harness/.github/cache-probe/reload8v16/memory.py &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true; wait "$sampler" 2>/dev/null || true' EXIT
          mkdir -p source/backend/src/test/java/org/springframework/test/context/cache
          cp harness/.github/cache-probe/affinity1070/DefaultContextCache.java.txt source/backend/src/test/java/org/springframework/test/context/cache/DefaultContextCache.java
          printf '%s  %s\n' 528880dacb9c744cec76a96157a03d511f4a2ba563507156e84fb4481467bf83 source/backend/src/test/java/org/springframework/test/context/cache/DefaultContextCache.java | sha256sum -c -
          cd source/backend
          ./gradlew --init-script "$GITHUB_WORKSPACE/harness/.github/cache-probe/reload8v16/observe.init.gradle" --max-workers=4 --info --profile --rerun-tasks integrationTest 2>&1 | tee "$GITHUB_WORKSPACE/observe/integration.log"
      - name: Preserve integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: affinity-b2-v2-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/backend/build/test-results/integrationTest/
            source/backend/build/reports/profile/
            observe/
          if-no-files-found: warn
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/backend
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - uses: actions/checkout@v6
        with:
          ref: d7d66773d8756f77dcd195f8621117a64e715a78
          path: source
      - name: Apply affinity candidate
        working-directory: ${{ github.workspace }}
        run: |
          base64 -d "$GITHUB_WORKSPACE/harness/.github/cache-probe/affinity1070/candidate-v2.b64" > /tmp/affinity-candidate.patch
          printf '%s  %s\n' 26c20a1f08380d00d30dcd719cdaf5e05f010f2a8aecb3e576e061f98adcb62a /tmp/affinity-candidate.patch | sha256sum -c -
          git -C source apply --check /tmp/affinity-candidate.patch
          git -C source apply /tmp/affinity-candidate.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Run unit tests
        run: ./gradlew test
      - name: Run acceptance tests
        run: ./gradlew acceptanceTest
      - name: Build JAR
        run: ./gradlew bootJar
      - name: Preserve remaining evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: affinity-b2-v2-remaining-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/backend/build/test-results/test/
            source/backend/build/test-results/acceptanceTest/
          if-no-files-found: warn
  verify:
    needs: [integration, remaining]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify both required jobs
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REMAINING_RESULT: ${{ needs.remaining.result }}
        run: test "$INTEGRATION_RESULT" = success && test "$REMAINING_RESULT" = success
