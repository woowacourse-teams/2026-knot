name: Observe CI fixture B control
on:
  push:
    branches:
      - 'be/chore/#1070'
    paths:
      - '.github/cache-probe/observe-fixture-trigger.txt'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Prepare same historical source
        env:
          AB_VARIANT: B
          AB_JOB: integration
          AB_REVISION: 84ce514c993d49a7833fd044e9f7565b908d1289
        run: bash .github/cache-probe/ab-prepare.sh
      - name: Restore recording test build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: crossrun-knot-20261029-1717-fixture
      - name: Require seed cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: exit 1
      - name: Run observed integration tests
        env:
          OBS_CASE: fixture
          OBS_VARIANT: B
          OBS_MODE: control
        run: bash .github/cache-probe/observe-integration.sh
      - name: Preserve integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observe-fixture-B-control-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ab-project/backend/build/test-results
            ${{ runner.temp }}/ab-project/backend/build/reports/profile
            ${{ runner.temp }}/observe
          if-no-files-found: warn
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Prepare same historical source
        working-directory: ${{ github.workspace }}
        env:
          AB_REVISION: 84ce514c993d49a7833fd044e9f7565b908d1289
        run: bash .github/cache-probe/ab-prepare.sh
      - name: Check formatting
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew spotlessCheck
      - name: Run unit tests
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew test
      - name: Run acceptance tests
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew acceptanceTest
      - name: Build
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew bootJar
      - name: Preserve remaining reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observe-fixture-B-control-remaining-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ab-project/backend/build/test-results
          if-no-files-found: warn
  verify:
    needs: [integration, remaining]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify required jobs
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REMAINING_RESULT: ${{ needs.remaining.result }}
        run: test "$INTEGRATION_RESULT" = success && test "$REMAINING_RESULT" = success
