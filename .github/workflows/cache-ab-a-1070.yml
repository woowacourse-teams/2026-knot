name: Full CI A/B A
on:
  push:
    branches:
      - 'be/chore/#1070'
    paths:
      - '.github/cache-probe/ab-trigger.txt'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Prepare same historical source
        env:
          AB_VARIANT: A
          AB_JOB: integration
        run: bash .github/cache-probe/ab-prepare.sh

      - name: Run integration tests
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew integrationTest --info 2>&1 | tee "$RUNNER_TEMP/integration-command.log"
      - name: Preserve integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ci-A-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/ab-project/backend/build/test-results
          if-no-files-found: warn
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Prepare same historical source
        working-directory: ${{ github.workspace }}
        run: bash .github/cache-probe/ab-prepare.sh
      - name: Check formatting
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew spotlessCheck
      - name: Run unit tests
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew test
      - name: Run acceptance tests
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew acceptanceTest
      - name: Build
        working-directory: ${{ runner.temp }}/ab-project/backend
        run: ./gradlew bootJar
      - name: Preserve remaining reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ci-A-remaining-${{ github.run_id }}
          path: ${{ runner.temp }}/ab-project/backend/build/test-results
          if-no-files-found: warn
  verify:
    needs: [integration, remaining]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify required jobs
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REMAINING_RESULT: ${{ needs.remaining.result }}
        run: test "$INTEGRATION_RESULT" = success && test "$REMAINING_RESULT" = success
