name: Cross-run integration cache experiment
on:
  push:
    branches:
      - 'be/chore/#1070'
permissions:
  contents: read
jobs:
  crossrun:
    strategy:
      fail-fast: false
      matrix:
        case: [document, application, fixture, negative, environment, image]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore previous-run build cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: crossrun-knot-20261029-1717-${{ matrix.case }}
      - name: Run comparison phase
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: bash .github/cache-probe/crossrun.sh
      - name: Save seed cache
        if: success() && hashFiles('.github/cache-probe/phase.txt') == hashFiles('.github/cache-probe/seed-marker.txt')
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: crossrun-knot-20261029-1717-${{ matrix.case }}
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossrun-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crossrun-results
          if-no-files-found: error
