version: 0.2

env:
  shell: bash
  variables:
    CI_GROUP: all
    DEPLOYMENT_MODE: legacy-in-place

phases:
  install:
    runtime-versions:
      java: corretto25

  pre_build:
    commands:
      - chmod +x backend/gradlew
      - ./backend/gradlew -p backend clean

  build:
    commands:
      - |
        set -euo pipefail
        test "$CODEBUILD_BUILD_SUCCEEDING" = 1
        case "$CI_GROUP" in
          all|integration|remaining) ;;
          *) printf 'Unknown CI_GROUP: %s\n' "$CI_GROUP" >&2; exit 2 ;;
        esac
        case "$DEPLOYMENT_MODE" in
          legacy-in-place|dev-bluegreen|prod-bluegreen) ;;
          *) printf 'Unknown DEPLOYMENT_MODE: %s\n' "$DEPLOYMENT_MODE" >&2; exit 2 ;;
        esac

        ./backend/gradlew -p backend testClasses --build-cache

        if [ "$CI_GROUP" = integration ]; then
          ./backend/gradlew -p backend integrationTest --rerun --no-build-cache
          exit 0
        fi

        ./backend/gradlew -p backend spotlessCheck --build-cache
        ./backend/gradlew -p backend test --rerun --no-build-cache
        if [ "$CI_GROUP" = all ]; then
          ./backend/gradlew -p backend integrationTest --rerun --no-build-cache
        fi
        ./backend/gradlew -p backend acceptanceTest --rerun --no-build-cache
        ./backend/gradlew -p backend bootJar --build-cache

        JAR_FILE=$(find backend/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)
        test -n "$JAR_FILE"
        cp "$JAR_FILE" app.jar
        bash backend/ops/codebuild/package-deployment-artifact.sh

artifacts:
  files:
    - app.jar
    - appspec.yml
    - scripts/**/*
    - backend/build/test-results/**/*
    - backend/build/reports/tests/**/*
  discard-paths: no

cache:
  key: gradle-v2-$CI_GROUP-$(codebuild-hash-files backend/build.gradle backend/settings.gradle backend/gradle/wrapper/gradle-wrapper.properties)-$(codebuild-hash-files 'backend/src/**/*.*')
  fallback-keys:
    - gradle-v2-$CI_GROUP-$(codebuild-hash-files backend/build.gradle backend/settings.gradle backend/gradle/wrapper/gradle-wrapper.properties)-
  paths:
    - '/root/.gradle/wrapper/**/*'
    - '/root/.gradle/caches/**/*'
